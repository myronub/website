<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>minu</title>
  <style>
    /* === BASE === */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600&display=swap');

    :root {
      --bg: #000;
      --text: #fff;
      --accent: #ff3b3b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none; /* hide default cursor */
    }

    body {
      height: 100vh;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* === COOL CURSOR === */
    .cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 24px;
      height: 24px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: transform 0.1s ease-out, width 0.2s, height 0.2s, background 0.2s;
      z-index: 999;
    }

    a:hover ~ .cursor,
    .hoverable:hover ~ .cursor {
      width: 40px;
      height: 40px;
      background: rgba(255, 59, 59, 0.1);
    }

    /* === MAIN CONTENT === */
    .container {
      text-align: center;
      animation: fadeIn 1.5s ease forwards;
    }

    .name {
      font-size: 4rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: lowercase;
      animation: glow 3s infinite alternate;
    }

    .desc {
      font-size: 1.3rem;
      margin-top: 10px;
      opacity: 0.85;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ff3b3b; }
      to { text-shadow: 0 0 25px #ff3b3b, 0 0 50px #ff3b3b; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === NORWEGIAN HOVER EFFECT === */
    .norwegian {
      position: relative;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(90deg, #ffffff, #ba0c2f, #00205b);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      background-size: 300%;
      animation: norwayGradient 3s infinite alternate;
    }

    @keyframes norwayGradient {
      from { background-position: 0%; }
      to { background-position: 100%; }
    }

    .flag {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 60px;
      height: 40px;
      background: linear-gradient(90deg, #ba0c2f 35%, #fff 35%, #fff 45%, #00205b 45%, #00205b 55%, #fff 55%, #fff 65%, #ba0c2f 65%);
      border: 2px solid #fff;
      border-radius: 4px;
      opacity: 0;
      transition: all 0.4s ease;
    }

    .norwegian:hover .flag {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* === DISCORD LINK === */
    .link {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 8px 16px;
      border-radius: 10px;
      transition: all 0.3s;
      opacity: 0.8;
    }

    .link:hover {
      opacity: 1;
      background: var(--accent);
      color: var(--bg);
    }

    /* === PARTICLE FX (background dots) === */
    .dot {
      position: absolute;
      width: 3px;
      height: 3px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.3;
      animation: float 8s infinite ease-in-out;
    }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-100vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="name">minu</div>
    <div class="desc">15 y/o <span class="norwegian">norwegian
      <span class="flag"></span>
    </span> coder & cool guy</div>
    <a href="https://myronub.vercel.app/d" class="link hoverable">discord</a>
  </div>

  <div class="cursor"></div>

  <script>
    /* === COOL CURSOR === */
    const cursor = document.querySelector('.cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.pageX + 'px';
      cursor.style.top = e.pageY + 'px';
    });

    /* === PARTICLES === */
    const body = document.body;
    for (let i = 0; i < 30; i++) {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      dot.style.left = Math.random() * 100 + 'vw';
      dot.style.top = Math.random() * 100 + 'vh';
      dot.style.animationDuration = 5 + Math.random() * 10 + 's';
      dot.style.animationDelay = Math.random() * 5 + 's';
      body.appendChild(dot);
    }
  </script>
</body>
</html>
